name: War Watch ratings

# Every morning Claude re-checks worldwide war and cyber/sabotage coverage and updates feed.json (Sundays: a full
# region-by-region review). The War Watch app downloads feed.json from this public repo. Needs the ANTHROPIC_API_KEY
# secret (set by Set-WarWatchSetup.cmd on Matt's PC; no AI sees it). Spending is capped in tools/wwapi.py (budget.json);
# when the cap is reached the job fails on purpose so GitHub emails, and the app shows "paused".

on:
  schedule:
    - cron: '41 10 * * *'        # daily ~2:41 AM Pacific (10:41 UTC); Batch API answers can take up to ~1-2 h
  workflow_dispatch:
    inputs:
      mode:
        description: 'daily or weekly'
        default: daily
      force:
        description: 'run even if the ratings were already updated today (yes/no)'
        default: 'yes'

permissions:
  contents: write

concurrency:
  group: ratings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
      - name: Test the job (fake API, no cost)
        run: python3 -m unittest tools/test_feed.py tools/test_headlines.py tools/test_focus.py
      - name: Get the worldwide headlines (from the hourly job)
        run: |
          mkdir -p live
          if git fetch -q --depth 1 origin live 2>/dev/null; then git archive FETCH_HEAD headlines.json spend.json | tar -x -C live && echo "[OK] headlines ready"; else echo "[WARN] no worldwide headlines yet"; fi
      - name: Update the ratings
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODE_INPUT: ${{ github.event.inputs.mode }}
          WW_FORCE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force != 'no' && '1' || '0' }}
        run: |
          set -euo pipefail
          mode="${MODE_INPUT:-}"
          if [ -z "$mode" ]; then if [ "$(date -u +%u)" = 7 ]; then mode=weekly; else mode=daily; fi; fi
          case "$mode" in daily|weekly) ;; *) echo "[ERROR] unknown mode '$mode' (daily or weekly)"; exit 1;; esac
          echo "[STEP] Mode: $mode"
          python3 tools/update_feed.py check
          python3 tools/update_feed.py "$mode"
      # Runs even when the update failed, so budget.json keeps the cost of failed runs too (feed.json only changes
      # when a new feed passed its checks, or to say the budget paused it).
      - name: Save the new ratings
        if: always()
        run: |
          tools/push_main.sh daily "Ratings $(date -u +%Y-%m-%d) ($(python3 -c 'import json;print(len(json.load(open("feed.json"))["conflicts"]))') hotspots)" \
            feed.json budget.json history.json outlooks.json notes
