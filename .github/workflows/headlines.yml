name: War Watch headlines

# Every hour: worldwide headlines (outlet feeds, Google News World pages, GDELT in 65 languages), non-English ones
# translated by Claude Haiku (Batch API). Published as headlines.json on the `live` branch, which is replaced each
# run (one commit, no history). Translation has its own monthly limit (WW_HEADLINES_CAP_USD) inside War Watch's cap.
# Then the focus updates (config/focus.json: Iran every 3 hours until it calms) are written into feed.json on main.

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write          # to start the next run and the daily ratings (see the last step)

jobs:
  headlines:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    concurrency:
      group: headlines
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - name: Get the last run's state
        run: tools/get_live.sh
      - name: Test the job (offline, no cost)
        id: tests
        run: tools/run_tests.sh
      - name: Collect and translate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 tools/headlines.py
      - name: Publish
        id: publish
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [ -f live/headlines.json ] || { echo "[ERROR] nothing to publish"; exit 1; }
          cd live
          rm -rf .git
          git init -q -b live
          git config user.name "War Watch headlines"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Headlines $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4; do
            if git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" live; then
              echo "[OK] published ($(du -h headlines.json | cut -f1) headlines.json)"; exit 0
            fi
            echo "[WARN] push failed (GitHub hiccup); retrying in $((i * 20)) s"; sleep $((i * 20))
          done
          echo "[ERROR] could not publish"; exit 1
      # Only after a good publish: it calls the API and pushes the app's feed.json, so not on code that failed the
      # tests and not on a stale corpus.
      - name: Focus updates (Iran every 3 hours until it calms)
        if: ${{ !cancelled() && steps.tests.outcome == 'success' && steps.publish.outcome == 'success' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -uo pipefail
          [ -f live/headlines.json ] || { echo "[WARN] no headlines; no focus update"; exit 0; }
          git fetch -q origin main && git reset -q --hard FETCH_HEAD      # the newest ratings and focus state
          python3 tools/focus.py
          tools/push_main.sh focus "Focus update $(date -u +%Y-%m-%dT%H:%MZ)" feed.json focus_budget.json
      # GitHub's schedule fires rarely and late for this repo (6 hours apart on 2026-11-04), so every run starts the
      # next one about 55 minutes after it began, unless another run is already waiting, and once a day (10:00-10:59
      # UTC) the ratings job, which skips itself if it already ran that day.
  # Its own job (and concurrency group), so its wait doesn't hold up a run started by hand meanwhile.
  chain:
    needs: headlines
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    concurrency:
      group: headlines-chain
      cancel-in-progress: false
    permissions:
      actions: write
    steps:
      - name: Start the next run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          repo="$GITHUB_REPOSITORY"
          if [ "$(date -u +%H)" = "10" ]; then
            mode=daily; [ "$(date -u +%u)" = 7 ] && mode=weekly
            gh api -X POST "repos/$repo/actions/workflows/daily.yml/dispatches" -f ref=main -f "inputs[mode]=$mode" -f "inputs[force]=no" \
              && echo "[OK] started the $mode ratings (skips itself if already done today)"
          fi
          started=$(gh api "repos/$repo/actions/runs/$GITHUB_RUN_ID" --jq '.run_started_at')
          wait=$(( $(date -u -d "$started" +%s) + 55 * 60 - $(date -u +%s) ))
          if [ "$wait" -gt 0 ]; then echo "[STEP] next run in $((wait / 60)) min"; sleep "$wait"; fi
          others=$(gh api "repos/$repo/actions/workflows/headlines.yml/runs?per_page=20" \
            --jq "[.workflow_runs[] | select(.id != $GITHUB_RUN_ID and (.status as \$s | [\"queued\",\"in_progress\",\"pending\",\"waiting\",\"requested\"] | index(\$s)))] | length")
          if [ "${others:-0}" -gt 0 ]; then echo "[OK] another headlines run is already waiting; it carries on"; exit 0; fi
          for i in 1 2 3; do
            gh api -X POST "repos/$repo/actions/workflows/headlines.yml/dispatches" -f ref=main && { echo "[OK] next run started"; exit 0; }
            sleep 30
          done
          echo "[ERROR] could not start the next run"; exit 1
